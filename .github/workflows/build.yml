# Builds FAKE5 for Windows (VST3, Standalone) and the Mac (VST3, AU, Standalone; Apple Silicon and Intel) and Linux (VST3, LV2, Standalone) on every
# push. The zips are under the run's "Artifacts"; a tag v* (or a release published on GitHub) also puts them in its
# release.
name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

env:
  # what JUCE needs to build on Linux
  LINUX_DEPS: >-
    libasound2-dev libjack-jackd2-dev libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev
    libxcomposite-dev libxrender-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev

jobs:
  # the engine's tests (tests/engine_tests.cpp): every program at three rates, every effect and the reverb, FM, unison,
  # chord memory, the arp, the sequencer, env routing, low split, 5 and 10 voices, any buffer size; no JUCE needed
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: cmake -S tests -B build-tests -DCMAKE_BUILD_TYPE=Release && cmake --build build-tests --parallel 4
      - name: run
        run: build-tests/engine_tests

  # the MPC plugin (mpc/): Akai's MPC Plugin SDK (pinned) builds it for the MPC's two CPUs and checks it; our own host
  # test plays it as the MPC would (44.1 kHz, its block sizes, programs, its saved state); then the Open MPC
  # catalog's zips, checked with its own tool
  mpc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: the MPC Plugin SDK (pinned)
        run: |
          git init -q mpc-sdk
          git -C mpc-sdk remote add origin https://github.com/inmusic-software/mpc-plugin-builder-sdk
          git -C mpc-sdk fetch -q --depth 1 origin a5949cf6fe2cbfb95bcbe0ddf1f7ef555e71f2be
          git -C mpc-sdk checkout -q FETCH_HEAD
      - name: version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="${GITHUB_REF_NAME#v}"
          sed -i -E "s/\"version\": \"[^\"]*\"/\"version\": \"$v\"/" mpc/plugin/plugin.json
          grep '"version"' mpc/plugin/plugin.json
      - name: build (native, arm32, arm64)
        run: python3 mpc/build.py --sdk mpc-sdk --target all
      - name: host test (the native build)
        run: |
          g++ -std=c++17 -O2 -Impc-sdk/framework mpc/test/mpc_host_test.cpp -ldl -o mpc_host_test
          ./mpc_host_test "mpc/build/FAKE5/build/native/fake5.so"
      - name: package
        run: |
          cd "mpc/build/FAKE5/build"
          file "swtdr34mz - VST - FAKE5/VST/"*.so
          cp "../README.md" "swtdr34mz - VST - FAKE5/README.md"
          zip -qr "$GITHUB_WORKSPACE/FAKE5-MPC.zip" "swtdr34mz - VST - FAKE5"
      - uses: actions/upload-artifact@v4
        with:
          name: FAKE5-MPC
          path: FAKE5-MPC.zip
      - name: the Open MPC catalog's tools (pinned)
        run: |
          git init -q openmpc
          git -C openmpc remote add origin https://github.com/open-mpc/mpc-vst-plugins
          git -C openmpc fetch -q --depth 1 origin aa81004516da80490a79b493061723513c438ff6
          git -C openmpc checkout -q FETCH_HEAD
      - name: catalog zips (per CPU) and the SDK zip
        run: |
          v=$(python3 -c "import json; print(json.load(open('mpc/plugin/plugin.json'))['version'])")
          python3 openmpc/tools/sdk_release.py "mpc/build/FAKE5/build/swtdr34mz - VST - FAKE5" --version "$v" \
            --id fake5 --repo swtdr34mz-afk/FAKE5 --license MPL-2.0 -o dist
          cp FAKE5-MPC.zip "dist/FAKE5-$v-mpc-sdk.zip"
          {
            echo "## Open MPC catalog zips ($v)"
            for z in dist/*-mpc-armv7.zip dist/*-mpc-aarch64.zip; do
              echo; echo "### $(basename "$z")"; echo '```'
              python3 openmpc/tools/catalog_check.py "$z" --catalog --expect-id fake5 --expect-repo swtdr34mz-afk/FAKE5 2>&1
              echo '```'
            done
            echo; echo "### SHA-256"; echo '```'; (cd dist && sha256sum *.zip); echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          for z in dist/*-mpc-armv7.zip dist/*-mpc-aarch64.zip; do
            python3 openmpc/tools/catalog_check.py "$z" --catalog --expect-id fake5 --expect-repo swtdr34mz-afk/FAKE5 > /dev/null
          done
      - uses: actions/upload-artifact@v4
        with:
          name: FAKE5-catalog
          path: dist/*.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'release' || github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        with:
          files: dist/*.zip

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-15-intel
            name: macOS
          - os: ubuntu-22.04
            name: Linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq $LINUX_DEPS

      - name: configure
        shell: bash
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: build
        shell: bash
        run: cmake --build build --config Release --parallel 4

      - name: pluginval (Windows)
        # the plugin checked as a host would: loading, its parameters fuzzed, state saved and restored, the editor
        # opened, every buffer size and rate (Tracktion's pluginval, strictness 8)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          $p = Start-Process -FilePath pluginval/pluginval.exe -ArgumentList '--strictness-level','8','--timeout-ms','600000','--output-dir','pluginval-log','--validate','"build/Fake5_artefacts/Release/VST3/FAKE5.vst3"' -Wait -PassThru -NoNewWindow
          Get-ChildItem pluginval-log -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName | Select-Object -Last 60 }
          if ($p.ExitCode -ne 0) { throw "pluginval failed ($($p.ExitCode))" }

      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: pluginval-log
          path: pluginval-log
          if-no-files-found: ignore

      - name: package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $a = "build/Fake5_artefacts/Release"
          $o = "FAKE5-Windows"
          New-Item -ItemType Directory -Force $o | Out-Null
          Copy-Item -Recurse "$a/VST3/FAKE5.vst3" $o/
          Copy-Item README.md $o/
          Compress-Archive -Path $o -DestinationPath FAKE5-Windows.zip

      - name: auval (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/Fake5_artefacts/Release/AU/FAKE5.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aumu Fak5 Swtd

      - name: package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          a="build/Fake5_artefacts/Release"
          o=FAKE5-macOS
          mkdir -p $o
          cp -R "$a/VST3/FAKE5.vst3" "$a/AU/FAKE5.component" "$a/Standalone/FAKE5.app" $o/
          for b in $o/*.vst3 $o/*.component $o/*.app; do codesign --force --deep -s - "$b"; done
          cp README.md $o/
          lipo -info "$o/FAKE5.vst3/Contents/MacOS/FAKE5"
          ditto -c -k --sequesterRsrc --keepParent $o $o.zip
          tar -czf $o.tar.gz $o   # (the same as a .tar.gz: some Macs' unzip had lost the plugins' signatures)

      - name: pluginval (Linux)
        # the same check as on Windows, in a virtual screen
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Linux.zip
          unzip -q pluginval.zip
          xvfb-run -a ./pluginval --strictness-level 8 --timeout-ms 600000 --validate "build/Fake5_artefacts/Release/VST3/FAKE5.vst3"

      - name: package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          a="build/Fake5_artefacts/Release"
          o=FAKE5-Linux
          mkdir -p $o
          cp -R "$a/VST3/FAKE5.vst3" "$a/LV2/FAKE5.lv2" "$a/Standalone/FAKE5" $o/
          cp README.md $o/
          tar czf $o.tar.gz $o

      - uses: actions/upload-artifact@v4
        with:
          name: FAKE5-${{ matrix.name }}
          path: |
            FAKE5-*.zip
            FAKE5-*.tar.gz

      - name: release
        if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'release' || github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            FAKE5-*.zip
            FAKE5-*.tar.gz
